[package]
name = "micro-host-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
micro-core.workspace = true
micro-ir = { workspace = true, features = ["svg-icons"] }
micro-vm.workspace = true
micro-store.workspace = true
micro-json.workspace = true
micro-os-core.workspace = true
micro-renderer-web = { path = "../micro-renderer-web" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Document",
  "console",
  "Element",
  "Event",
  "EventTarget",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlAudioElement",
  "HtmlMediaElement",
  "KeyboardEvent",
  "Node",
  "NodeList",
  "Window",
  "Storage",
  "SpeechSynthesis",
  "SpeechSynthesisUtterance",
  "SpeechSynthesisVoice",
] }
js-sys = "0.3"
